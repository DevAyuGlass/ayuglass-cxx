name: build-android

on:
  workflow_dispatch:

env:
  SDL_TAG: release-3.2.0   # можно поднять на свежий релиз SDL3

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Download prebuilt TDLib and Skia (3 ABI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p deps/tdlib/$abi deps/skia/$abi
            gh release download deps -p "tdlib-android-$abi.tar.gz" -D deps
            gh release download deps -p "skia-android-$abi.tar.gz" -D deps
            tar -xzf deps/tdlib-android-$abi.tar.gz -C deps/tdlib/$abi
            tar -xzf deps/skia-android-$abi.tar.gz -C deps/skia/$abi
            # Td при установке запомнил абсолютный путь к OpenSSL со сборки TDLib:
            # $GITHUB_WORKSPACE/openssl/<abi>/lib/libssl.a. Воссоздаём его симлинком.
            mkdir -p openssl
            ln -sfn "$PWD/deps/tdlib/$abi/openssl" "openssl/$abi"
          done
          ls -l openssl/*/lib/libssl.a

      - name: Skia extra headers (skcms) из исходников того же коммита
        run: |
          set -e
          SHA=$(cat deps/skia/arm64-v8a/SKIA_COMMIT.txt)
          git clone --depth 1 --no-checkout https://skia.googlesource.com/skia.git skia-hdr
          cd skia-hdr
          git sparse-checkout set modules/skcms
          if git fetch --depth 1 origin "$SHA"; then git checkout -q FETCH_HEAD; else echo "SHA недоступен, берём HEAD"; git checkout -q HEAD; fi
          ls modules/skcms | head
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p ../deps/skia/$abi/modules
            cp -r modules/skcms ../deps/skia/$abi/modules/
          done

      - name: Fetch SDL3 (исходники и Android-шаблон)
        run: git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git SDL3-src

      - name: Prepare Gradle project
        run: |
          set -e
          cp -r SDL3-src/android-project android-build
          # наш CMake вместо шаблонного; пути приходят через переменные окружения
          cat > android-build/app/jni/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(ayuglass_android LANGUAGES C CXX)
          set(TD_ROOT "$ENV{DEPS_DIR}/tdlib")
          set(SKIA_ROOT "$ENV{DEPS_DIR}/skia")
          set(SDL3_SOURCE_DIR "$ENV{SDL_SRC}")
          set(TG_API_ID "$ENV{TG_API_ID}")
          set(TG_API_HASH "$ENV{TG_API_HASH}")
          add_subdirectory("$ENV{APP_SRC}" ayuglass)
          EOF
          cd android-build
          # Шаблон SDL по умолчанию собирает через ndk-build (Android.mk, android-19).
          # Подменяем app/build.gradle на свой: CMake, minSdk 24, три ABI.
          NS=$(grep -oP "namespace\s*['\"]\K[^'\"]+" app/build.gradle | head -1)
          echo "namespace из шаблона: $NS"
          test -f app/src/main/java/org/libsdl/app/SDLActivity.java || { echo "нет SDLActivity.java в шаблоне"; find . -name SDLActivity.java; exit 1; }
          cp app/build.gradle app/build.gradle.orig
          cat > app/build.gradle <<EOF
          apply plugin: 'com.android.application'

          android {
              namespace "$NS"
              compileSdk 34
              defaultConfig {
                  applicationId "org.ayuglass.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "0.1"
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
                  externalNativeBuild {
                      cmake { arguments "-DANDROID_PLATFORM=android-24", "-DANDROID_STL=c++_static" }
                  }
              }
              externalNativeBuild {
                  cmake { path 'jni/CMakeLists.txt' }
              }
          }
          EOF

      - name: Build APK
        env:
          DEPS_DIR: ${{ github.workspace }}/deps
          SDL_SRC: ${{ github.workspace }}/SDL3-src
          APP_SRC: ${{ github.workspace }}
          # Ключи вшиваются ТОЛЬКО в приватном репозитории (артефакты публичных видны всем)
          TG_API_ID: ${{ github.event.repository.private && secrets.TG_API_ID || '' }}
          TG_API_HASH: ${{ github.event.repository.private && secrets.TG_API_HASH || '' }}
        run: |
          set -o pipefail   # без этого код возврата берётся от tee и падение Gradle маскируется
          cd android-build
          chmod +x gradlew
          # повторяем при сетевых сбоях (например, 504 при скачивании Gradle)
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle.log; then exit 0; fi
            echo "попытка $i не удалась"
            # повторяем только сетевые сбои, ошибки компиляции повторять бессмысленно
            grep -q -E "HTTP response code|Could not (GET|HEAD|resolve|download)|Read timed out|Connection (reset|timed out)" gradle.log || exit 1
            if [ "$i" = "1" ]; then
              # запасной вариант: качаем дистрибутив Gradle с зеркала, а не с GitHub
              V=$(grep -o 'gradle-[0-9.]*-bin.zip' gradle/wrapper/gradle-wrapper.properties | head -1)
              sed -i '/^distributionUrl=/d' gradle/wrapper/gradle-wrapper.properties
              echo "distributionUrl=https\://mirrors.cloud.tencent.com/gradle/$V" >> gradle/wrapper/gradle-wrapper.properties
              echo "переключились на зеркало: $V"
            fi
            sleep 30
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ayuglass-debug-apk
          path: android-build/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
