name: skia-android

on:
  workflow_dispatch:

env:
  API_LEVEL: 24

permissions:
  contents: write   # чтобы класть сборки в релиз "deps"

jobs:
  skia:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            cpu: arm64
          - abi: armeabi-v7a
            cpu: arm
          - abi: x86_64
            cpu: x64

    steps:
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3 git

      - name: Locate NDK
        run: echo "NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}" >> "$GITHUB_ENV"

      - name: Fetch Skia
        run: |
          set -e
          git clone --depth 1 https://skia.googlesource.com/skia.git
          cd skia
          python3 tools/git-sync-deps

      - name: Build Skia (${{ matrix.abi }})
        run: |
          set -e
          cd skia
          bin/gn gen out/Release --args="
            target_os=\"android\"
            target_cpu=\"${{ matrix.cpu }}\"
            ndk=\"$NDK\"
            ndk_api=${API_LEVEL}
            is_official_build=true
            is_component_build=false
            skia_use_gl=true
            skia_use_system_expat=false
            skia_use_system_freetype2=false
            skia_use_system_harfbuzz=false
            skia_use_system_icu=false
            skia_use_system_libjpeg_turbo=false
            skia_use_system_libpng=false
            skia_use_system_libwebp=false
            skia_use_system_zlib=false
            skia_use_freetype=true
            skia_use_harfbuzz=true
            skia_use_icu=true
            skia_enable_skshaper=true
            skia_enable_skunicode=true
            skia_enable_skparagraph=true
            skia_enable_pdf=false
            skia_enable_tools=false
          "
          # Если имена целей другие: bin/gn ls out/Release | grep -E "sk(ia|shaper|unicode|paragraph)"
          ninja -C out/Release skia skshaper skunicode_core skunicode_icu skparagraph

      - name: Package
        run: |
          set -e
          mkdir -p pkg/lib
          cd skia
          cp out/Release/*.a ../pkg/lib/
          cp -r include ../pkg/include
          for m in skshaper skunicode skparagraph; do
            mkdir -p ../pkg/modules/$m
            cp -r modules/$m/include ../pkg/modules/$m/include
          done
          cd ..
          git -C skia rev-parse HEAD > pkg/SKIA_COMMIT.txt

      - name: Upload to release "deps"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tar -C pkg -czf skia-android-${{ matrix.abi }}.tar.gz .
          gh release upload deps skia-android-${{ matrix.abi }}.tar.gz --clobber --repo ${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: skia-android-${{ matrix.abi }}
          path: pkg
